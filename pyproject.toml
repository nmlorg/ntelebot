[project]
name = 'ntelebot'
version = '0.4.6.1'
description = 'A simple implementation of https://core.telegram.org/bots/api.'
authors = [
    {name = 'Daniel Reed', email = 'nmlorg@gmail.com'},
]
requires-python = '>=3.10'
dependencies = [
    'requests',
]

[project.entry-points.pytest11]
ntelebot = 'ntelebot.testing'

[project.optional-dependencies]
dev = [
    'pylint',
    'pytest-cov',
    'pytest',
    'requests-mock',
]

[project.urls]
Homepage = 'https://github.com/nmlorg/ntelebot'
Issues = 'https://github.com/nmlorg/ntelebot/issues'

[tool.pylint.'MESSAGES CONTROL']
disable = [
    'consider-using-ternary',
    'duplicate-code',
    'inconsistent-return-statements',
]

[tool.pytest.ini_options]
addopts = '-rN --cov=ntelebot --cov-report=html'
consider_namespace_packages = true
testpaths = ['ntelebot']
verbosity_assertions = 2

[tool.setuptools.packages.find]
include = ['ntelebot', 'ntelebot.*']

[tool.tox]
env_list = ['py310', 'py311', 'py312', 'py313', 'py314', 'py315']
skip_missing_interpreters = true

[tool.tox.env_run_base]
extras = ['dev']
deps = [
    'yapf',
]
pass_env = [
    'TEST_BOT_CHAT_ID',
    'TEST_BOT_TOKEN',
]
commands = [
    ['yapf', '-i', '-r', 'examples', 'ntelebot'],
    ['python', '-B', '-m', 'pytest'],
    ['pylint', 'examples', 'ntelebot'],
]

[tool.yapf]
based_on_style = 'google'
column_limit = 100
